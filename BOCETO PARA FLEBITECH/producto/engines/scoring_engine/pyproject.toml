[project]
name = "motor-scoring-colsubsidio"
version = "2.0.0"
description = "Motor de scoring de seguros con normalización por lift y disparadores duros."
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "D", "UP", "B", "SIM"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D104"]
# catalog.py es data generada: los racionales son textos largos de una sola línea.
"scoring_engine/catalog.py" = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
