<line x1="360" y1="431" x2="392" y2="431" stroke="#9FB0C8" stroke-width="2" marker-end="url(#ah)"/>

<rect x="398" y="356" width="214" height="66" rx="10" fill="#1BA5B8"/>
<text x="505" y="384" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Motor de propensión</text>
<text x="505" y="403" font-size="11" fill="#E6F6F9" text-anchor="middle">segmenta: quién necesita qué</text>

<rect x="398" y="442" width="214" height="66" rx="10" fill="#1B2A4A"/>
<text x="505" y="470" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Motor de cotización</text>
<text x="505" y="489" font-size="11" fill="#C9D6EE" text-anchor="middle">determinista: precio y cobertura</text>

<rect x="624" y="356" width="214" height="66" rx="10" fill="#3B4EA0"/>
<text x="731" y="384" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">LLM · Gemini</text>
<text x="731" y="403" font-size="11" fill="#D8DEF4" text-anchor="middle">conversa y redacta el porqué</text>

<rect x="624" y="442" width="214" height="66" rx="10" fill="#F5A623"/>
<text x="731" y="470" font-size="14" font-weight="bold" fill="#1E2433" text-anchor="middle">Base de datos</text>
<text x="731" y="489" font-size="11" fill="#5A4415" text-anchor="middle">trazabilidad + consentimiento</text>

<text x="866" y="378" font-size="13" fill="#1E2433">La IA conversa.</text>
<text x="866" y="399" font-size="13" fill="#1E2433">Los motores deciden y</text>
<text x="866" y="420" font-size="13" fill="#1E2433">calculan (no inventan).</text>
<text x="866" y="447" font-size="13" fill="#1E2433">La base de datos deja</text>
<text x="866" y="468" font-size="13" fill="#1E2433">la prueba de por qué.</text>

<text x="398" y="536" font-size="11" fill="#6B7688">Determinista = mismo dato, mismo resultado.    ·    Trazabilidad = adiós “caja negra”.</text>

