name: Flebitech CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GROQ_API_KEY: ""
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall -q backend api
      - run: ruff check backend api tests
      - run: python test_conversacional.py
      - run: python test_orchestrator.py
      - run: python test_mock_1000.py
      - run: python test_flebitech.py
      - run: pytest -q --cov=backend --cov=api --cov-report=term-missing
